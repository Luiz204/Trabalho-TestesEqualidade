name: QA Automation CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    name: API Tests (Petstore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes de API
        run: |
          pytest api_tests/ -v --html=reports/api_report.html --self-contained-html

      - name: Upload relatorio de API
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/api_report.html

  web-tests:
    name: Web Tests (SauceDemo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Executar testes Web
        run: |
          pytest web_tests/ -v --html=reports/web_report.html --self-contained-html
        env:
          HEADLESS: "true"

      - name: Upload relatorio Web
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-report
          path: reports/web_report.html